name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Inventarizaciya.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inventarizaciya-apk
          path: out/Inventarizaciya.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Inventarizaciya build ${{ github.run_number }}
          body: Download Inventarizaciya.apk on your phone and install it.
          files: out/Inventarizaciya.apk
