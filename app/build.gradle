plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.inventory.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.inventory.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Один постоянный ключ подписи: обновления ставятся поверх без потери данных.
    signingConfigs {
        shared {
            storeFile rootProject.file("keystore/inventory.jks")
            storePassword "inventory"
            keyAlias "inventory"
            keyPassword "inventory"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
